name: Update J-League Matches

on:
  schedule:
    # 毎日 日本時間 6:00 (UTC 21:00) に自動実行
    - cron: '0 21 * * *'
  # 手動で実行したい時のボタンも有効化
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install requests beautifulsoup4

    - name: Run fetch_jleague.py
      run: |
        python fetch_jleague.py

    - name: Commit and push if changed
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add src/jleague_matches.json
        git diff-index --quiet HEAD || git commit -m "auto: Jリーグ試合データの自動更新"
        git push